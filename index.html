<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiet File Transfer - 音響通信ファイル転送</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🔊 Quiet File Transfer</h1>
<div class="subtitle">音響通信でファイルを秘密裏に転送</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('send')">📤 送信</div>
  <div class="tab" onclick="switchTab('receive')">📥 受信</div>
</div>

<!-- 送信パネル -->
<div id="panel-send" class="panel active">
  <div class="card">
    <h2>1. ファイルを選択</h2>
    <input type="file" id="fileInput" onchange="onFileSelected(event)">
    <div id="fileInfo" class="file-list"></div>
  </div>
  
  <div class="card">
    <h2>2. 通信モード</h2>
    <div class="mode-select">
      <button class="mode-btn active" onclick="setMode('ultrasonic')" id="mode-ultrasonic">超音波<br><small>人間には聞こえない</small></button>
      <button class="mode-btn" onclick="setMode('audible')" id="mode-audible">可聴域<br><small>安定して通信</small></button>
    </div>
    <div class="stats">
      <div class="stat-box"><div class="val" id="pktSize">80</div><div class="lbl">バイト/パケット</div></div>
      <div class="stat-box"><div class="val" id="pktCount">-</div><div class="lbl">総パケット数</div></div>
    </div>
  </div>
  
  <div class="card">
    <h2>3. 送信</h2>
    <button class="btn-primary" id="sendBtn" onclick="startSend()" disabled>ファイルを送信</button>
    <button class="btn-danger" id="stopBtn" onclick="stopSend()" style="display:none;margin-top:8px;">送信を中止</button>
    <div class="progress-container">
      <div class="progress-bar" id="sendProgress">0%</div>
    </div>
    <div class="log" id="sendLog">準備完了。ファイルを選択してください。</div>
  </div>
</div>

<!-- 受信パネル -->
<div id="panel-receive" class="panel">
  <div class="card">
    <h2>1. 通信モード</h2>
    <div class="mode-select">
      <button class="mode-btn active" onclick="setRxMode('ultrasonic')" id="rxmode-ultrasonic">超音波</button>
      <button class="mode-btn" onclick="setRxMode('audible')" id="rxmode-audible">可聴域</button>
    </div>
    <button class="btn-primary" id="recvBtn" onclick="startReceive()">受信を開始</button>
    <button class="btn-danger" id="stopRecvBtn" onclick="stopReceive()" style="display:none;margin-top:8px;">受信を停止</button>
  </div>
  
  <div class="card">
    <h2>2. 受信状況</h2>
    <div class="stats">
      <div class="stat-box"><div class="val" id="rxPackets">0</div><div class="lbl">受信パケット</div></div>
      <div class="stat-box"><div class="val" id="rxTotal">-</div><div class="lbl">総パケット数</div></div>
    </div>
    <div class="progress-container">
      <div class="progress-bar" id="recvProgress">0%</div>
    </div>
    <div class="log" id="recvLog">受信を開始するには「受信を開始」を押してください。</div>
  </div>
  
  <div class="card" id="downloadCard" style="display:none;">
    <h2>3. ファイル復元</h2>
    <div id="recvFileInfo"></div>
    <button class="btn-secondary" onclick="downloadFile()">📥 ファイルをダウンロード</button>
  </div>
</div>

<script src="https://quiet.github.io/quiet-js/javascripts/quiet.js"></script>
<script src="script.js"></script>
<script async src="https://quiet.github.io/quiet-js/javascripts/quiet-emscripten.js"></script>

</body>
</html>
